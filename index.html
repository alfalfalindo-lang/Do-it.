<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>do it</title>
<link href="https://fonts.cdnfonts.com/css/itc-american-typewriter" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2b2b2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="do it">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
  if("serviceWorker" in navigator){
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/service-worker.js");
    });
  }
</script>
</head>
<body>

<div class="sidebar">
  <div class="topo-sidebar">
    <div class="bolinhas">
      <div class="bola vermelha"></div>
      <div class="bola amarela"></div>
      <div class="bola verde"></div>
    </div>
    <h1 class="logo">do it</h1>
  </div>
  <div class="sidebar-section">
    <button id="tarefasBtn" class="sidebar-btn active"><span>tarefas</span><span class="badge" id="badgeTarefas"></span></button>
    <button id="metasBtn" class="sidebar-btn"><span>metas</span><span class="badge" id="badgeMetas"></span></button>
    <button id="arquivoBtn" class="sidebar-btn"><span>arquivo</span><span class="badge" id="badgeArquivo"></span></button>
    <button id="calendarioBtn" class="sidebar-btn">calendário</button>
  </div>
  <div class="sidebar-divider"></div>
  <div class="sidebar-section">
    <button id="notasBtn" class="sidebar-btn">notas</button>
    <button id="postitBtn" class="sidebar-btn">post-it</button>
  </div>
  <div class="sidebar-divider"></div>
  <div class="sidebar-section">
    <p class="sidebar-label">filtrar por categoria</p>
    <button class="filtro-btn active" data-cat="todas">todas</button>
    <button class="filtro-btn" data-cat="trabalho">💼 trabalho</button>
    <button class="filtro-btn" data-cat="estudo">📚 estudo</button>
    <button class="filtro-btn" data-cat="pessoal">🏠 pessoal</button>
  </div>
  <div class="sidebar-divider"></div>
  <div class="sidebar-section">
    <p class="sidebar-label">filtrar por cor</p>
    <div class="filtro-cores">
      <button class="filtro-cor-btn active" data-filtrocor="todas" title="todas"><div class="cor-all">◉</div></button>
      <button class="filtro-cor-btn" data-filtrocor="#ff5f57" title="vermelho"><div class="bola-filtro" style="background:#ff5f57"></div></button>
      <button class="filtro-cor-btn" data-filtrocor="#ffd60a" title="amarelo"><div class="bola-filtro" style="background:#ffd60a"></div></button>
      <button class="filtro-cor-btn" data-filtrocor="#30d158" title="verde"><div class="bola-filtro" style="background:#30d158"></div></button>
    </div>
  </div>
  <div class="sidebar-divider"></div>
  <div class="sidebar-section sidebar-bottom">
    <p class="sidebar-label" id="progressLabel">progresso</p>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <p class="progress-text" id="progressText"></p>
  </div>
</div>

<button class="criarTopo" id="novoBtn" title="nova tarefa">+</button>

<div class="main">
  <div class="calendar-style">
    <div class="month" id="mesTopo"></div>
    <div class="day" id="diaTopo"></div>
  </div>
  <div class="main-inner">
    <div class="busca-wrap">
      <span class="busca-icon">⌕</span>
      <input type="text" id="campoBusca" placeholder="buscar tarefas..." autocomplete="off">
    </div>
    <div id="listaTarefas"></div>
  </div>
</div>

<!-- CALENDÁRIO FULL -->
<div class="cal-full-overlay" id="calFullOverlay">
  <div class="cal-full">
    <div class="cal-full-header">
      <div class="cal-full-nav">
        <button class="cal-full-nav-btn" id="calFullPrev">‹</button>
        <span class="cal-full-title" id="calFullTitle"></span>
        <button class="cal-full-nav-btn" id="calFullNext">›</button>
        <button class="cal-full-nav-btn cal-today-btn" id="calFullHoje">hoje</button>
      </div>
      <div class="cal-view-toggle">
        <button class="cal-view-btn active" data-view="mes" id="btnViewMes">mês</button>
        <button class="cal-view-btn" data-view="semana" id="btnViewSemana">semana</button>
      </div>
      <button class="cal-full-fechar" id="calFullFechar">✕</button>
    </div>
    <div class="cal-full-body" id="calFullBody"></div>
  </div>
</div>

<!-- MODAL TAREFA -->
<div class="modal" id="modal">
  <div class="modal-box">
    <button class="fechar" id="fecharModal">✕</button>
    <h2 id="modalTitulo">nova tarefa</h2>
    <input type="text" id="titulo" placeholder="título">
    <div class="modal-row">
      <label class="modal-label">data</label>
      <div class="custom-date-wrap">
        <input type="text" id="dataDisplay" placeholder="dd/mm/aaaa" readonly class="date-display">
        <div class="mini-cal" id="miniCal"></div>
      </div>
    </div>
    <div class="modal-row">
      <label class="modal-label">horário</label>
      <div class="horario-wrap">
        <input type="text" id="horaInput" placeholder="hh" maxlength="2" class="time-part">
        <span class="time-sep">:</span>
        <input type="text" id="minInput" placeholder="mm" maxlength="2" class="time-part">
      </div>
    </div>
    <div class="modal-row">
      <label class="modal-label">dias da semana</label>
      <div class="dias-semana">
        <button class="dia-btn" data-dia="seg">seg</button>
        <button class="dia-btn" data-dia="ter">ter</button>
        <button class="dia-btn" data-dia="qua">qua</button>
        <button class="dia-btn" data-dia="qui">qui</button>
        <button class="dia-btn" data-dia="sex">sex</button>
        <button class="dia-btn" data-dia="sab">sáb</button>
        <button class="dia-btn" data-dia="dom">dom</button>
      </div>
    </div>
    <div class="modal-row">
      <label class="modal-label">cor</label>
      <div class="cores">
        <button class="cor vermelha selected" data-cor="#ff5f57"></button>
        <button class="cor amarela" data-cor="#ffd60a"></button>
        <button class="cor verde" data-cor="#30d158"></button>
      </div>
    </div>
    <div class="modal-row">
      <label class="modal-label">categoria</label>
      <div class="cats">
        <button class="cat-btn selected" data-cat="trabalho">💼 trabalho</button>
        <button class="cat-btn" data-cat="estudo">📚 estudo</button>
        <button class="cat-btn" data-cat="pessoal">🏠 pessoal</button>
      </div>
    </div>
    <div class="modal-row">
      <label class="modal-label">prioridade</label>
      <div class="prioridades">
        <button class="prio-btn" data-prio="baixa">baixa</button>
        <button class="prio-btn selected" data-prio="normal">normal</button>
        <button class="prio-btn" data-prio="alta">alta</button>
      </div>
    </div>
    <div class="modal-row">
      <label class="modal-label recorrente-label">
        <input type="checkbox" id="recorrenteCheck"> recorrente
      </label>
      <div id="recorrenteOpcoes" class="recorrente-opcoes hidden">
        <select id="frequencia">
          <option value="diaria">diária</option>
          <option value="semanal">semanal</option>
        </select>
      </div>
    </div>
    <div class="modal-row">
      <label class="modal-label">nota rápida</label>
      <textarea id="notaRapida" placeholder="detalhes opcionais..." rows="2" class="nota-rapida-input"></textarea>
    </div>
    <div class="modal-acoes">
      <button id="criar" class="criarMinimal">criar</button>
    </div>
  </div>
</div>

<!-- MODAL DETALHE TAREFA -->
<div class="modal" id="modalDetalhe">
  <div class="modal-box">
    <button class="fechar" id="fecharDetalhe">✕</button>
    <div class="detalhe-cor-barra" id="detalheCorBarra"></div>
    <h2 id="detalheTitulo"></h2>
    <div id="detalheInfos" class="detalhe-infos"></div>
    <div id="detalheNota" class="detalhe-nota"></div>
    <div class="modal-acoes detalhe-acoes">
      <button id="detalheEditar" class="criarMinimal">editar</button>
      <button id="detalheConcluir" class="criarMinimal btn-concluir">concluir ✓</button>
    </div>
  </div>
</div>

<!-- MODAL NOTAS -->
<div class="modal" id="modalNotas">
  <div class="notas-box">
    <button class="fechar-notas">✕</button>
    <div class="notas-nav">
      <button id="paginaAnterior">‹</button>
      <span id="paginaInfo"></span>
      <button id="proximaPagina">›</button>
      <button id="novaPagina">+</button>
    </div>
    <textarea id="paginaAtual"></textarea>
  </div>
</div>

<div class="lixeira" id="lixeira">🗑</div>

<script src="script.js"></script>
</body>
</html>
