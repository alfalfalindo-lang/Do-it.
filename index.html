<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>do it</title>

<link href="https://fonts.cdnfonts.com/css/itc-american-typewriter" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="sidebar">

<div class="topo-sidebar">

<div class="bolinhas">
<div class="bola vermelha"></div>
<div class="bola amarela"></div>
<div class="bola verde"></div>
</div>

<h1 class="logo">do it</h1>

</div>

<button id="tarefasBtn">tarefas</button>
<button id="metasBtn">metas</button>

<button id="notasBtn">notas</button>
<button id="postitBtn">post-it</button>

</div>


<button class="criarTopo" id="novoBtn">+</button>


<div class="main">

<div class="calendar-style">
<div class="month" id="mesTopo"></div>
<div class="day" id="diaTopo"></div>
</div>

<div id="listaTarefas"></div>

</div>


<div class="lixeira" id="lixeira">🗑</div>


<!-- MODAL -->

<div class="modal" id="modal">

<div class="modal-box">

<button class="fechar">✕</button>

<h2>nova tarefa</h2>

<input type="text" id="titulo" placeholder="digite">

<input type="date" id="data">

<div class="cores">

<button class="cor vermelha" data-cor="#ff5f57"></button>
<button class="cor amarela" data-cor="#ffd60a"></button>
<button class="cor verde" data-cor="#30d158"></button>

</div>

<button id="criar" class="criarMinimal">criar</button>

</div>

</div>


<!-- NOTAS -->

<div class="modal" id="modalNotas">

<div class="notas-box">

<button class="fechar-notas">✕</button>

<textarea id="paginaAtual"></textarea>

</div>

</div>


<script src="script.js"></script>

</body>
</html>
