<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>do it</title>

<link href="https://fonts.cdnfonts.com/css/itc-american-typewriter" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="sidebar">

<div class="topo-sidebar">

<div class="bolinhas">
<div class="bola vermelha"></div>
<div class="bola amarela"></div>
<div class="bola verde"></div>
</div>

<h1 class="logo">do it</h1>

</div>

<button id="novoBtn">novo</button>
<button id="tarefasBtn">tarefas</button>
<button id="incompletasBtn">incompletas</button>
<button id="metasBtn">metas</button>
<button id="notasBtn">notas</button>
<button id="postitBtn">post-it</button>

</div>

<div class="main">

<div class="calendar-style">
<div class="month" id="mesTopo"></div>
<div class="day" id="diaTopo"></div>
</div>

<div id="listaTarefas"></div>

</div>

<div class="lixeira" id="lixeira">🗑</div>

<div class="modal" id="modal">

<div class="modal-box">

<button class="fechar">✕</button>

<h2>nova tarefa</h2>

<input type="text" id="titulo" placeholder="tarefa">

<input type="date" id="data">

<div class="cores">
<button class="cor vermelha" data-cor="vermelha"></button>
<button class="cor amarela" data-cor="amarela"></button>
<button class="cor verde" data-cor="verde"></button>
</div>

<div class="botoes-modal">
<button id="cancelar">cancelar</button>
<button id="criar">criar</button>
</div>

</div>

</div>

<div class="modal" id="modalNotas">

<div class="notas-box">

<button class="fechar-notas">✕</button>

<div class="bloco-notas">
<textarea id="paginaAtual"></textarea>
</div>

<div class="controle-notas">
<button id="paginaAnterior">◀</button>
<span id="numeroPagina">1</span>
<button id="proximaPagina">▶</button>
<button id="novaPagina">＋</button>
</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
